<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>metrics-sv</title>
<style>
/* ============================================================================
 * 工事みえるマップ 3D Beta / Construction Public Twin Portal
 * Design tokens + shared primitives.
 *
 * SOURCE OF TRUTH: WebUI/koji-mieru-map-3d.html (lines 14-321).
 * These tokens are a faithful port of the exported design. Do not substitute
 * default framework theme colors or typography.
 *
 * Component-specific layout lives in per-component CSS Modules
 * (components/**/*.module.css) so that files stay single-writer.
 * ==========================================================================*/

:root {
  /* --- surface / text --- */
  --bg: oklch(97.5% 0.005 250);
  --surface: oklch(100% 0 0);
  --surface-2: oklch(96.5% 0.006 250);
  --fg: oklch(22% 0.02 240);
  --muted: oklch(50% 0.018 240);
  --faint: oklch(64% 0.014 240);
  --border: oklch(90% 0.008 240);
  --border-strong: oklch(83% 0.01 240);

  /* --- accent --- */
  --accent: oklch(58% 0.16 145);
  --accent-ink: oklch(30% 0.09 150);
  --accent-soft: color-mix(in oklch, oklch(58% 0.16 145) 12%, white);

  /* --- status --- */
  --st-planned: oklch(58% 0.14 250);
  --st-active: oklch(70% 0.16 60);
  --st-reg: oklch(58% 0.2 27);
  --st-done: oklch(58% 0.13 155);
  --st-hold: oklch(60% 0.012 250);
  --st-night: oklch(54% 0.15 300);
  --st-detour: oklch(66% 0.11 220);

  /* --- type --- */
  --font-body: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Kaku Gothic ProN",
    "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  /* --- misc --- */
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 10px 28px -14px rgba(16, 24, 40, 0.28);
  --radius: 12px;

  /* --- layout (design contract) --- */
  --topbar-h: 60px;
  --statusbar-h: 38px;
  --detail-w: 396px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

[hidden] {
  display: none !important;
}

html,
body {
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

button,
input,
select,
textarea {
  font-family: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

/* --------------------------------------------------------------------------
 * Shared primitives (global class names — used across many components)
 * ------------------------------------------------------------------------*/

.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}

.num {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* floating glass panel */
.float {
  position: absolute;
  background: color-mix(in oklch, white 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 20;
}

/* --- status pills --- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.pill.planned {
  color: oklch(44% 0.14 250);
  background: color-mix(in oklch, var(--st-planned) 14%, white);
  border: 1px solid color-mix(in oklch, var(--st-planned) 34%, white);
}
.pill.active {
  color: oklch(42% 0.12 60);
  background: color-mix(in oklch, var(--st-active) 16%, white);
  border: 1px solid color-mix(in oklch, var(--st-active) 40%, white);
}
.pill.reg {
  color: oklch(42% 0.18 27);
  background: color-mix(in oklch, var(--st-reg) 13%, white);
  border: 1px solid color-mix(in oklch, var(--st-reg) 34%, white);
}
.pill.done {
  color: oklch(38% 0.1 155);
  background: color-mix(in oklch, var(--st-done) 13%, white);
  border: 1px solid color-mix(in oklch, var(--st-done) 34%, white);
}
.pill.cat {
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.pill.solid {
  color: #fff;
  background: var(--status, var(--muted));
  border: 1px solid var(--status, var(--muted));
}

/* --- severity pills (impact events) --- */
.sev-pill {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  white-space: nowrap;
}
.sev-pill.info {
  color: oklch(40% 0.1 220);
  background: color-mix(in oklch, var(--st-detour) 16%, white);
}
.sev-pill.notice {
  color: oklch(42% 0.12 60);
  background: color-mix(in oklch, var(--st-active) 18%, white);
}
.sev-pill.warning {
  color: oklch(42% 0.18 27);
  background: color-mix(in oklch, var(--st-reg) 15%, white);
}

/* --- filter chips --- */
.fchip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  background: var(--surface);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.fchip .fa {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--faint);
}
.fchip:hover {
  color: var(--fg);
  border-color: var(--muted);
}
.fchip.active {
  background: oklch(35% 0.02 240);
  border-color: oklch(35% 0.02 240);
  color: #fff;
}
.fchip.active .fa {
  background: #fff;
}
.fchip .fc-n {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--faint);
  margin-left: 1px;
}
.fchip.active .fc-n {
  color: rgba(255, 255, 255, 0.78);
}
.fchip[data-f="active"] .fa {
  background: var(--st-active);
}
.fchip[data-f="planned"] .fa {
  background: var(--st-planned);
}
.fchip[data-f="reg"] .fa {
  background: var(--st-reg);
}
.fchip[data-f="done"] .fa {
  background: var(--st-done);
}

/* --- small toggle chip --- */
.tchip {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  color: var(--muted);
  background: var(--surface);
}
.tchip:hover {
  color: var(--fg);
  border-color: var(--muted);
}
.tchip.active {
  background: oklch(35% 0.02 240);
  border-color: oklch(35% 0.02 240);
  color: #fff;
}

/* --- button --- */
.chip-btn {
  height: 28px;
  padding: 0 11px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.chip-btn:hover {
  color: var(--fg);
  border-color: var(--muted);
}
.chip-btn.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.top-btn {
  height: 34px;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--fg);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.top-btn:hover {
  border-color: var(--muted);
}
.top-btn.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.top-btn .tcount {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--border-strong);
  display: grid;
  place-items: center;
  font-weight: 700;
  color: var(--muted);
  background: var(--surface);
}
.icon-btn:hover {
  color: var(--fg);
  border-color: var(--muted);
}

/* --- segmented control --- */
.seg {
  display: flex;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  padding: 2px;
}
.seg button {
  flex: 1;
  height: 28px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  padding: 0 12px;
  white-space: nowrap;
}
.seg button.active {
  background: var(--surface);
  color: var(--fg);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}

/* --- switch --- */
.switch {
  width: 34px;
  height: 20px;
  border-radius: 999px;
  background: oklch(84% 0.01 250);
  position: relative;
  flex: 0 0 auto;
  transition: background 0.15s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  transition: transform 0.15s;
}
.on > .switch,
.switch.on {
  background: var(--accent);
}
.on > .switch::after,
.switch.on::after {
  transform: translateX(14px);
}

/* --- section heading (mono uppercase) --- */
.lg-head {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  font-family: var(--font-mono);
  padding: 11px 9px 4px;
}
.lg-head:first-child {
  padding-top: 2px;
}

.grp-head {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 10px 4px 5px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 7px;
}
.grp-head .gd {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
}
.grp-head .gn {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
}

.empty-note {
  font-size: 12px;
  color: var(--muted);
  padding: 8px;
}

/* --- toast --- */
.toast {
  position: fixed;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: oklch(24% 0.02 240);
  color: #fff;
  font-size: 12.5px;
  padding: 10px 16px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  z-index: 120;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  max-width: min(560px, calc(100vw - 32px));
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* --- modal --- */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(16, 24, 40, 0.42);
  backdrop-filter: blur(3px);
  z-index: 110;
  display: grid;
  place-items: center;
  padding: 24px;
}
.modal {
  background: var(--surface);
  border-radius: 16px;
  max-width: 520px;
  width: 100%;
  max-height: calc(100vh - 48px);
  overflow: auto;
  box-shadow: 0 30px 80px -20px rgba(16, 24, 40, 0.6);
}
.modal header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.modal header h2 {
  font-size: 16px;
  font-weight: 800;
}
.modal .body {
  padding: 18px 20px;
  display: grid;
  gap: 14px;
}

/* --- spinner --- */
.spinner {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: oklch(93% 0.008 250);
  z-index: 10;
  gap: 10px;
}
.spinner .ring {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 3px solid var(--border-strong);
  border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ============================================================================
 * 工事詳細 UI（components/project/** 専用）
 * 単一ライター: projectui
 *
 * 出典: WebUI/koji-mieru-map-3d.html の
 *   .detail / .d-hero / .d-tags / .d-title / .d-formal / .d-meta /
 *   .d-sec / .benefits / .cta-row / .btn / .imp / .src / .disclaimer /
 *   .photo-card / .siteviewer / .sv-*
 * 色・角丸・余白は app/globals.css のトークンを使う（独自 hex は増やさない）。
 * ==========================================================================*/

/* --------------------------------------------------------------------------
 * カード全体
 * ------------------------------------------------------------------------*/

.detail {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  background: var(--surface);
}

/* --------------------------------------------------------------------------
 * ヒーロー（状態・名称・メタ情報）
 * ------------------------------------------------------------------------*/

.dHero {
  position: relative;
  overflow: hidden;
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.dHero::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 3px;
  background: var(--muted);
}
.heroPlanned::before {
  background: var(--st-planned);
}
.heroActive::before {
  background: var(--st-active);
}
.heroDone::before {
  background: var(--st-done);
}
.heroHold::before {
  background: var(--st-hold);
}

.dTags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 10px;
}

.dTitle {
  font-size: 20px;
  font-weight: 900;
  line-height: 1.35;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}

.dFormal {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
}

.dMeta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}
.dMetaFull {
  grid-column: 1 / -1;
}
.k {
  font-size: 10.5px;
  color: var(--faint);
  letter-spacing: 0.04em;
}
.v {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.v small {
  display: block;
  font-weight: 400;
  color: var(--muted);
  font-size: 11px;
}
.vInline {
  display: flex;
  align-items: flex-start;
  gap: 5px;
}
.vInline svg {
  flex: 0 0 auto;
  margin-top: 4px;
  color: var(--faint);
}

/* --------------------------------------------------------------------------
 * セクション
 * ------------------------------------------------------------------------*/

.dSec {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
}
.dSec:last-child {
  border-bottom: 0;
}
.dSec h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  font-family: var(--font-mono);
  margin-bottom: 10px;
}
.dSec h3.h3Spaced {
  margin-top: 14px;
}
.secCount {
  margin-left: auto;
  font-size: 10px;
  letter-spacing: 0.02em;
  text-transform: none;
  color: var(--muted);
}
.lead {
  font-size: 13.5px;
  line-height: 1.75;
}
.note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  margin-top: 8px;
}

/* --------------------------------------------------------------------------
 * 整備効果
 * ------------------------------------------------------------------------*/

.benefits {
  list-style: none;
  display: grid;
  gap: 8px;
  margin-top: 4px;
}
.benefits li {
  display: flex;
  gap: 9px;
  font-size: 13px;
  align-items: flex-start;
}
.benefits li svg {
  flex: 0 0 auto;
  margin-top: 3px;
  color: var(--accent);
}

/* --------------------------------------------------------------------------
 * ボタン（デザインの .btn / .btn.ghost）
 * ------------------------------------------------------------------------*/

.btn {
  height: 42px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid transparent;
  transition:
    background 0.15s,
    border-color 0.15s,
    color 0.15s;
}
.btnGhost {
  background: var(--surface);
  border-color: var(--border-strong);
  color: var(--fg);
}
.btnGhost:hover {
  background: var(--surface-2);
  border-color: var(--muted);
}
.photoOpen {
  width: 100%;
  margin-top: 10px;
}

/* --------------------------------------------------------------------------
 * 工区情報
 * ------------------------------------------------------------------------*/

.zoneList {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px 14px;
}
.zoneList dt {
  font-size: 10.5px;
  color: var(--faint);
  letter-spacing: 0.04em;
}
.zoneList dd {
  font-size: 12.5px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

/* --------------------------------------------------------------------------
 * 写真（クレジット必須）
 * ------------------------------------------------------------------------*/

.photoCard {
  margin: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface-2);
}
.photoCard img {
  display: block;
  width: 100%;
  /* width/height 属性より CSS のアスペクト比を優先させる */
  height: auto;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  background: oklch(90% 0.008 250);
}
.photoCard figcaption {
  padding: 8px 11px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
}
.photoCard figcaption b {
  color: var(--fg);
  font-weight: 600;
}
.photoCard a {
  color: var(--accent-ink);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-bottom: 1px solid color-mix(in oklch, var(--accent) 40%, white);
}
.photoCard a:hover {
  border-bottom-color: var(--accent);
}

/* --------------------------------------------------------------------------
 * 交通規制・影響イベント
 * ------------------------------------------------------------------------*/

.imp {
  list-style: none;
  display: grid;
  gap: 10px;
}
.impItem {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 12px;
  border-left: 4px solid var(--muted);
  background: var(--surface);
  transition:
    background 0.15s,
    border-color 0.15s;
}
.impItem:hover {
  background: var(--surface-2);
}
.impWarning {
  border-left-color: var(--st-reg);
}
.impNotice {
  border-left-color: var(--st-active);
}
.impInfo {
  border-left-color: var(--st-detour);
}
.inactive {
  opacity: 0.55;
}
.impSelected {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.impTop {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  margin-bottom: 4px;
}
.impTitle {
  font-size: 13px;
  font-weight: 700;
}
.impPills {
  display: flex;
  gap: 5px;
  align-items: center;
  flex: 0 0 auto;
}
.impDesc {
  display: block;
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.6;
}
.impPeriod {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.impPeriod b {
  color: var(--fg);
  font-weight: 600;
}
.impState {
  font-weight: 700;
}
.impStateActive {
  font-weight: 700;
  color: var(--accent-ink);
}

/* --------------------------------------------------------------------------
 * 工期タイムライン
 * ------------------------------------------------------------------------*/

.tl {
  display: grid;
  gap: 6px;
}
.tlHead {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
}
.tlHeadLabel {
  font-weight: 700;
  color: var(--fg);
}
.tlNowLabel b {
  color: var(--fg);
}
.tlTrack {
  position: relative;
  min-height: 22px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
}
.tlWork {
  position: absolute;
  top: 3px;
  height: 11px;
  border-radius: 6px;
  background: var(--accent);
}
.tlBand {
  position: absolute;
  height: 5px;
  border-radius: 3px;
  opacity: 0.92;
}
.tlBandWarning {
  background: var(--st-reg);
}
.tlBandNotice {
  background: var(--st-active);
}
